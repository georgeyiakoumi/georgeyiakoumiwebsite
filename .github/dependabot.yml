version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node 22 runtime used by Netlify and CI.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      strapi:
        patterns: ['@strapi/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Strapi 5's admin panel runs on React 18.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # The CMS runs on Node 22 (its engines field allows <=22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
